    <title>SunuAnnales</title>
    <script>
      // Suppress benign Vite HMR websocket noise in preview iframe environments
      (function() {
        var isWsError = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.stack || String(val));
          return str.includes('WebSocket') || str.includes('websocket') || str.includes('ws://') || str.includes('wss://');
        };
        window.addEventListener('unhandledrejection', function (e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function (e) {
          if (isWsError(e.message) || isWsError(e.error)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
