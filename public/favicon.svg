<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0245a3"/>
      <stop offset="50%" stop-color="#052d75"/>
      <stop offset="100%" stop-color="#02143d"/>
    </linearGradient>

    <!-- Glossy Highlight Overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cap Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Book Shadow -->
    <filter id="bookGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Clip Path for Senegal Flag ribbon over document -->
    <clipPath id="docClip">
      <rect x="146" y="172" width="220" height="155" rx="20"/>
    </clipPath>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#appBg)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Glossy Top Highlight -->
  <path d="M 0 116 C 0 52 52 0 116 0 L 396 0 C 460 0 512 52 512 116 L 512 210 Q 256 290 0 210 Z" fill="url(#gloss)"/>

  <!-- Central Graphic Group with shadow -->
  <g filter="url(#shadow)">
    <!-- 1. Document / Notepad -->
    <rect x="146" y="172" width="220" height="155" rx="20" fill="#ffffff"/>
    
    <!-- Document subtle edge shadow -->
    <path d="M 146 307 Q 256 335 366 307 L 366 327 L 146 327 Z" fill="#e2e8f0" opacity="0.6"/>

    <!-- 3 Blue text lines on document -->
    <rect x="172" y="214" width="130" height="13" rx="6.5" fill="#003893"/>
    <rect x="172" y="246" width="98" height="13" rx="6.5" fill="#003893"/>
    <rect x="172" y="278" width="62" height="13" rx="6.5" fill="#003893"/>

    <!-- Senegal Flag Banner draped diagonally on document -->
    <g clip-path="url(#docClip)">
      <!-- Green Stripe -->
      <path d="M 230 335 L 290 170 L 328 170 L 268 335 Z" fill="#00853f"/>
      <!-- Yellow Stripe -->
      <path d="M 268 335 L 328 170 L 366 170 L 306 335 Z" fill="#fdef42"/>
      <!-- Red Stripe -->
      <path d="M 306 335 L 366 170 L 380 170 L 380 335 Z" fill="#e31b23"/>
      <!-- Green 5-point star on yellow stripe -->
      <!-- Center around x=325, y=285 -->
      <polygon points="325,274 328,283 337,283 330,288 332,297 325,292 318,297 320,288 313,283 322,283" fill="#00853f"/>
    </g>

    <!-- 2. Open Book Wings at the Bottom -->
    <g filter="url(#bookGlow)">
      <!-- Lower Cyan Book Layer -->
      <!-- Left cyan wing -->
      <path d="M 64 382 C 120 382 195 385 256 426 C 215 392 140 376 64 382 Z" fill="#0284c7"/>
      <path d="M 64 382 C 125 380 200 398 256 426 L 256 414 C 205 384 135 368 64 372 Z" fill="#38bdf8"/>
      
      <!-- Right cyan wing -->
      <path d="M 448 382 C 392 382 317 385 256 426 C 297 392 372 376 448 382 Z" fill="#0284c7"/>
      <path d="M 448 382 C 387 380 312 398 256 426 L 256 414 C 307 384 377 368 448 372 Z" fill="#38bdf8"/>

      <!-- Upper White Book Pages -->
      <!-- Left white page -->
      <path d="M 76 336 C 135 334 206 352 256 388 C 204 362 135 348 76 352 Z" fill="#f8fafc"/>
      <path d="M 76 336 C 135 334 206 352 256 388 L 256 374 C 202 342 135 324 76 328 Z" fill="#ffffff"/>

      <!-- Right white page -->
      <path d="M 436 336 C 377 334 306 352 256 388 C 308 362 377 348 436 352 Z" fill="#f8fafc"/>
      <path d="M 436 336 C 377 334 306 352 256 388 L 256 374 C 310 342 377 324 436 328 Z" fill="#ffffff"/>

      <!-- Book Spine V Center -->
      <polygon points="256,380 250,426 256,432 262,426" fill="#0f172a"/>
    </g>

    <!-- 3. Graduation Mortarboard Cap at the Top -->
    <!-- Cap Headband / Skullcap -->
    <path d="M 172 132 C 172 132 170 178 256 178 C 342 178 340 132 340 132 Z" fill="#0284c7"/>
    <path d="M 174 138 C 190 162 225 174 256 174 C 287 174 322 162 338 138 Z" fill="#0369a1"/>

    <!-- Mortarboard Diamond Top (Pure White) -->
    <polygon points="256,62 396,128 256,192 116,128" fill="#ffffff"/>
    <!-- Diamond bottom 3D rim -->
    <polygon points="116,128 256,192 256,200 116,136" fill="#cbd5e1"/>
    <polygon points="396,128 256,192 256,200 396,136" fill="#94a3b8"/>

    <!-- Mortarboard Button Center -->
    <ellipse cx="256" cy="128" rx="8" ry="6" fill="#e2e8f0"/>

    <!-- White Tassel hanging to the right -->
    <path d="M 256 128 Q 338 132 376 170 L 376 212" fill="none" stroke="#f1f5f9" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Tassel fringed bell -->
    <path d="M 372 208 L 380 208 L 384 236 L 368 236 Z" fill="#ffffff"/>
    <circle cx="376" cy="208" r="4.5" fill="#e2e8f0"/>
  </g>
</svg>
